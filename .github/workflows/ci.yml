name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Build
        run: mvn install -B
      - name: Test non-Maven project
        env:
          CITRUS_CAMEL_JBANG_DUMP_INTEGRATION_OUTPUT: "true"
        run: |
         echo "Install JBang via SDKMAN"

         curl -s "https://get.sdkman.io" | bash 
         source "/home/runner/.sdkman/bin/sdkman-init.sh"
         sdk install jbang

         jbang --version

         jbang trust add https://github.com/citrusframework/citrus/
         jbang trust add https://github.com/apache/camel/

         jbang citrus@citrusframework/citrus --version
         jbang camel@apache/camel --version

         echo "Running tests"

         pushd camel/camel-edi-x12-as2/test
         jbang citrus@citrusframework/citrus run edi-x12-as2.camel.it.yaml
         popd
  generate_uml_diagrams:
    if: github.repository == 'smooks/smooks-examples' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      - uses: ts-graphviz/setup-graphviz@v2
      - run: curl -LJ https://github.com/plantuml/plantuml/releases/download/v1.2023.13/plantuml-1.2023.13.jar -o plantuml.jar
      - run: java -jar plantuml.jar -v -tpng -r **/docs/*.puml -o images
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: generate UML diagrams [skip ci]'
          push_options: --force
          file_pattern: '**/docs/images/*.png'
          disable_globbing: true
